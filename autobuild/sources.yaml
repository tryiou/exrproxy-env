- name: UTXO_PLUGIN
  type: utxo_plugin
  utxo_plugin_image: blocknetdx/utxo-plugin:latest
  plugin_adapter_image: blocknetdx/plugin-adapter:latest
  exclude_chains: # The utxo-plugin module doesn't yet work for the following chains:
    - LBC
  volume: /snode
  disk: 200
  ram: 32
  cpu: 8

- name: HYDRA
  type: app
  free: False
  disk: 1
  ram: 16
  cpu: 4
  chains:
    - name: AVAX
    - name: ETH
    - name: NEVM
      
- name: XQUERY
  type: app
  volume: /snode
  disk: 15
  ram: 16
  cpu: 32
  dexs:
    - name: AVAX_PANGOLIN
      target_sleep_time: 30
      num_safety_blocks: 10
    - name: NEVM_PEGASYS
      target_sleep_time: 60
      num_safety_blocks: 5
