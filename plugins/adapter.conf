# XCloud plugin configuration for the wallet index bridge.
#
# The node executes this plugin itself when a client calls
#   blocknet-cli xrService xrs::adapter <ticker> <jsonrpc-payload>
# The xrs:: namespace is optional — removeNamespace() strips it — so the
# bare form is accepted too:
#   blocknet-cli xrService adapter <ticker> <jsonrpc-payload>
# via `private::type=rpc`: blocknetd POSTs a JSON-RPC request to
# http://<rpcip>:<rpcport>/ with method=<rpccommand> and
# params=[<ticker>, <jsonrpc-payload>], every parameter serialised as a
# string (see XRouterServer::processServiceCall).
#
# The proxy path (/xrs/adapter) is configured separately, in
# start-xrproxy.sh, with RPC_adapter_HOSTIP/PORT/USER/PASS/METHOD.
# Both paths hit the same container.
#
# No clientrequestlimit here: the node then falls back to the [Main]
# clientrequestlimit rendered into xrouter.conf, so the throttle has one
# source of truth.

parameters=string,string
fee=0
disabled=0
help=Forward one stock ElectrumX JSON-RPC request to the wallet index bridge. Usage: adapter [ticker] [jsonrpc-payload]

private::type=rpc
private::rpccommand=adapter
private::rpcip=plugin-adapter
private::rpcport=5000
